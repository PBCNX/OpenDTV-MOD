plugins {
    id 'com.android.application'
}

android {
    namespace 'ph.opendtv'
    compileSdk 35

    defaultConfig {
        applicationId "ph.opendtv"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "2.1"
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:2.1.21')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Playback: TS demux by Media3's extractor, decoding by the phone's MediaCodec first, with FFmpeg
    // (NextLib, GPL-3.0) as the software fallback for formats MediaCodec can't play.
    def media3 = '1.7.1'
    implementation "androidx.media3:media3-exoplayer:$media3"
    implementation "androidx.media3:media3-ui:$media3"
    // FFmpeg decoders (libavcodec/libavutil/libswresample/libswscale + libmedia3ext JNI). Version = <media3>-<nextlib>.
    implementation 'io.github.anilbeesetti:nextlib-media3ext:1.7.1-0.9.0'
}
