<!doctype html>
<html><head><meta charset="utf-8">

  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:transparent}

<div id="stage"><div id="media"></div><div id="content"></div></div>

<script src="bml.js"></script>
